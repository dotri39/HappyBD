<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chúc Mừng Sinh Nhật Chị Đoàn Nguyễn Quế Trân 🎂</title>

  <!-- Load Google Fonts hỗ trợ đầy đủ tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">

  <!-- Thư viện pháo giấy nhẹ qua CDN (kèm bộ pháo giấy dự phòng tự viết nếu mở offline) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    /* ==========================================================================
       1. CÀI ĐẶT MÀU SẮC & PHONG CÁCH CHUNG (PASTEL HỒNG DỊU - KEM)
       ========================================================================== */
    :root {
      --bg-pink-light: #fff6f9;
      --bg-pink-mid: #ffe8f0;
      --bg-cream: #fffaf3;
      --peach-pink: #ffacc5;
      --rose-pink: #ec7fa5;
      --rose-deep: #d65a84;
      --cream-yellow: #fff1cc;
      --paper-bg: #fffbf8;
      --paper-border: #f8cfe0;
      --text-main: #6d4352;
      --text-soft: #966879;
      --white-soft: rgba(255, 255, 255, 0.88);
      --shadow-soft: 0 12px 32px rgba(214, 90, 132, 0.14);
      --shadow-btn: 0 6px 16px rgba(236, 127, 165, 0.25);
      --font-hand: 'Dancing Script', cursive;
      --font-title: 'Pacifico', cursive;
      --font-body: 'Quicksand', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: var(--font-body);
      color: var(--text-main);
      background: linear-gradient(145deg, var(--bg-pink-light) 0%, var(--bg-pink-mid) 48%, var(--bg-cream) 100%);
      position: relative;
      user-select: none;
    }

    /* ==========================================================================
       2. HẠT TRÁI TIM & CÁNH HOA BAY LƠ LỬNG NỀN + CANVAS PHÁO GIẤY
       ========================================================================== */
    #floating-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      bottom: -40px;
      opacity: 0.55;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 2px 4px rgba(236, 127, 165, 0.15));
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(0.9);
        opacity: 0;
      }
      15% {
        opacity: 0.6;
      }
      85% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-110vh) translateX(35px) rotate(360deg) scale(1.1);
        opacity: 0;
      }
    }

    #ambient-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* ==========================================================================
       3. QUẢN LÝ 3 MÀN HÌNH & HIỆU ỨNG CHUYỂN CẢNH
       ========================================================================== */
    .screen {
      position: relative;
      z-index: 5;
      width: 100%;
      min-height: 100dvh;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      opacity: 0;
      transform: scale(0.96) translateY(12px);
      transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screen.active {
      display: flex;
    }

    .screen.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* Kiểu nút bấm chung */
    .btn-pastel {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(135deg, #f38fb0 0%, #e36c95 100%);
      border: 2px solid #fff5f8;
      padding: 12px 26px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-pastel:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 22px rgba(227, 108, 149, 0.36);
      background: linear-gradient(135deg, #f79bb9 0%, #e8779e 100%);
    }

    .btn-pastel:active {
      transform: translateY(1px) scale(0.97);
    }

    .btn-pastel.secondary {
      background: linear-gradient(135deg, #fff8fa 0%, #ffe6ef 100%);
      color: var(--rose-deep);
      border: 2px solid #f7bfd2;
    }

    .btn-pastel.secondary:hover {
      background: linear-gradient(135deg, #ffffff 0%, #ffdbe8 100%);
    }

    /* ==========================================================================
       4. MÀN 1: MÀN MỞ ĐẦU (PHONG BÌ THƯ)
       ========================================================================== */
    .intro-title {
      font-family: var(--font-hand);
      font-size: clamp(1.9rem, 5.5vw, 2.7rem);
      color: var(--rose-deep);
      text-align: center;
      margin-bottom: 36px;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
      animation: gentlePulse 3s ease-in-out infinite;
    }

    @keyframes gentlePulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .envelope-wrapper {
      position: relative;
      width: 280px;
      height: 190px;
      margin: 15px auto 40px;
      cursor: pointer;
      perspective: 900px;
    }

    /* Hiệu ứng rung nhẹ gợi ý bấm vào */
    .envelope-wrapper.wobble {
      animation: envelopeWobble 3.2s ease-in-out infinite;
    }

    @keyframes envelopeWobble {
      0%, 82%, 100% { transform: rotate(0deg) translateY(0); }
      86% { transform: rotate(-3deg) translateY(-4px); }
      90% { transform: rotate(3deg) translateY(-4px); }
      94% { transform: rotate(-2deg) translateY(-2px); }
      98% { transform: rotate(2deg) translateY(-1px); }
    }

    .envelope {
      position: relative;
      width: 100%;
      height: 100%;
      background: #f7adc6;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 16px 36px rgba(214, 90, 132, 0.22);
    }

    /* Lá thư bên trong phong bì */
    .envelope-letter {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 12px;
      height: 162px;
      background: var(--paper-bg);
      border-radius: 12px;
      border: 2px solid #fce0ea;
      padding: 18px 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      z-index: 2;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.35s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .letter-mini-title {
      font-family: var(--font-hand);
      font-size: 1.35rem;
      color: var(--rose-deep);
    }

    .letter-mini-lines {
      width: 80%;
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: center;
    }

    .letter-mini-lines span {
      display: block;
      height: 5px;
      border-radius: 4px;
      background: #f9d5e2;
      width: 100%;
    }

    .letter-mini-lines span:nth-child(2) { width: 85%; }
    .letter-mini-lines span:nth-child(3) { width: 65%; }

    /* Các mặt gấp của phong bì */
    .envelope-pocket {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 0 0 16px 16px;
      overflow: hidden;
      pointer-events: none;
    }

    .envelope-pocket::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #ffc4d8 0%, #f9b1c9 100%);
      clip-path: polygon(0 0, 52% 55%, 0 100%);
    }

    .envelope-pocket::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(225deg, #ffc4d8 0%, #f5a6c1 100%);
      clip-path: polygon(100% 0, 48% 55%, 100% 100%);
    }

    .envelope-bottom {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: linear-gradient(180deg, #ffcedf 0%, #f8b4cb 100%);
      clip-path: polygon(0 100%, 50% 46%, 100% 100%);
      border-radius: 0 0 16px 16px;
      pointer-events: none;
    }

    /* Nắp phong bì */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 112px;
      background: linear-gradient(180deg, #f59cb9 0%, #f9b8cd 100%);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      transform-origin: top center;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.1s 0.25s;
      z-index: 5;
    }

    /* Con dấu trái tim */
    .heart-seal {
      position: absolute;
      top: 86px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: radial-gradient(circle at 30% 30%, #ff82a9, #d94b78);
      border-radius: 50%;
      border: 3px solid #fff3f7;
      box-shadow: 0 4px 12px rgba(217, 75, 120, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }

    .heart-seal svg {
      width: 24px;
      height: 24px;
      fill: #fff7fa;
      animation: beat 1.4s infinite ease-in-out;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.16); }
    }

    /* Trạng thái khi mở phong bì */
    .envelope-wrapper.open {
      animation: none;
    }

    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-wrapper.open .heart-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
    }

    .envelope-wrapper.open .envelope-letter {
      transform: translateY(-92px);
    }

    /* ==========================================================================
       5. MÀN 2: LÁ THƯ (HIỆN DẦN TỪNG DÒNG)
       ========================================================================== */
    .letter-card {
      position: relative;
      width: 100%;
      max-width: 560px;
      background: linear-gradient(180deg, #fffdfb 0%, #fff3f7 100%);
      border-radius: 24px;
      padding: 34px 28px 30px;
      box-shadow: var(--shadow-soft);
      border: 2px solid var(--paper-border);
      margin-bottom: 22px;
      overflow: hidden;
    }

    /* Viền hoa văn nhẹ bên trong tờ giấy thư */
    .letter-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1.5px dashed #f5c2d4;
      border-radius: 16px;
      pointer-events: none;
    }

    .corner-ornament {
      position: absolute;
      width: 34px;
      height: 34px;
      opacity: 0.7;
      pointer-events: none;
    }
    .corner-tl { top: 14px; left: 14px; }
    .corner-tr { top: 14px; right: 14px; transform: scaleX(-1); }
    .corner-bl { bottom: 14px; left: 14px; transform: scaleY(-1); }
    .corner-br { bottom: 14px; right: 14px; transform: scale(-1, -1); }

    .letter-content {
      position: relative;
      z-index: 2;
      font-family: var(--font-hand);
      font-size: clamp(1.32rem, 4vw, 1.55rem);
      line-height: 1.65;
      color: #6b3c4e;
      min-height: 290px;
    }

    .letter-greeting {
      font-size: clamp(1.55rem, 4.6vw, 1.85rem);
      font-weight: 700;
      color: var(--rose-deep);
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.5s ease;
    }

    .letter-paragraph {
      margin-bottom: 14px;
      text-indent: 18px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .letter-sign {
      text-align: right;
      font-size: clamp(1.45rem, 4.3vw, 1.7rem);
      font-weight: 700;
      color: var(--rose-deep);
      margin-top: 18px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.55s ease;
    }

    .reveal-line {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    .typing-cursor::after {
      content: " 💗";
      font-size: 0.9em;
      animation: blinkCursor 0.8s infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Nút Tiếp theo chỉ hiện sau khi thư chạy xong */
    #btn-next-screen3 {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px) scale(0.95);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #btn-next-screen3.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    /* ==========================================================================
       6. MÀN 3: TRANG CHÍNH (CỜ, BÁNH KEM 2 TẦNG, NẾN 20, HỘP QUÀ, NÚT TƯƠNG TÁC)
       ========================================================================== */
    #screen-3 {
      justify-content: flex-start;
      padding-top: 8px;
      padding-bottom: 36px;
    }

    /* Băng rôn cờ tam giác (HAPPY BIRTHDAY) */
    .bunting-container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
      z-index: 6;
    }

    .bunting-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 4px;
      width: 100%;
      padding: 4px 6px;
      position: relative;
      animation: buntingSway 4.2s ease-in-out infinite alternate;
      transform-origin: top center;
    }

    .bunting-row:nth-child(2) {
      animation-delay: -2.1s;
    }

    @keyframes buntingSway {
      0% { transform: rotate(-1.2deg); }
      100% { transform: rotate(1.2deg); }
    }

    /* Dây treo cờ */
    .bunting-row::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 5%;
      right: 5%;
      height: 2px;
      background: #e69bb5;
      border-radius: 2px;
      z-index: 0;
    }

    .flag {
      position: relative;
      z-index: 1;
      width: clamp(24px, 6.8vw, 38px);
      height: clamp(32px, 8.8vw, 48px);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: clamp(4px, 1.2vw, 8px);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: clamp(0.75rem, 2.5vw, 1.05rem);
      color: #fff;
      text-shadow: 0 1px 2px rgba(150, 50, 85, 0.35);
      transform-origin: top center;
      animation: flagFlutter 2.6s ease-in-out infinite alternate;
    }

    .flag:nth-child(odd) { background: linear-gradient(180deg, #f794b5, #ec749d); }
    .flag:nth-child(even) { background: linear-gradient(180deg, #ffbbcf, #f597b6); }
    .flag:nth-child(3n) { background: linear-gradient(180deg, #ffd1b3, #fca985); }
    .flag:nth-child(4n) { background: linear-gradient(180deg, #e78ab0, #d46693); }

    @keyframes flagFlutter {
      0% { transform: rotate(-2.5deg); }
      100% { transform: rotate(2.5deg); }
    }

    /* Tiêu đề chúc mừng sinh nhật */
    .main-birthday-title {
      font-family: var(--font-hand);
      font-size: clamp(1.85rem, 5.8vw, 2.75rem);
      color: var(--rose-deep);
      text-align: center;
      line-height: 1.25;
      margin: 4px 10px 6px;
      text-shadow: 0 3px 12px rgba(255, 255, 255, 0.95), 0 1px 3px rgba(214, 90, 132, 0.2);
      z-index: 6;
    }

    /* Dòng chữ điều ước xuất hiện sau khi thổi nến */
    .wish-message {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      z-index: 6;
    }

    .wish-badge {
      font-family: var(--font-hand);
      font-size: clamp(1.3rem, 4.2vw, 1.65rem);
      color: #c94674;
      background: rgba(255, 250, 242, 0.92);
      border: 1.5px solid #f7bdd0;
      padding: 6px 20px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(236, 127, 165, 0.22);
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .wish-badge.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Bóng bay lơ lửng hai bên */
    .side-balloons {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      width: clamp(46px, 9vw, 68px);
      animation: balloonFloat 5s ease-in-out infinite alternate;
      filter: drop-shadow(0 8px 14px rgba(214, 90, 132, 0.16));
      opacity: 0.85;
    }

    .balloon.b-left-1 { left: 2%; top: 18%; animation-duration: 4.8s; }
    .balloon.b-left-2 { left: 5%; top: 52%; animation-duration: 5.6s; animation-delay: -1.5s; }
    .balloon.b-right-1 { right: 2%; top: 22%; animation-duration: 5.2s; animation-delay: -0.8s; }
    .balloon.b-right-2 { right: 5%; top: 56%; animation-duration: 6s; animation-delay: -2.2s; }

    @keyframes balloonFloat {
      0% { transform: translateY(0) rotate(-4deg); }
      100% { transform: translateY(-18px) rotate(4deg); }
    }

    /* Sân khấu bánh kem ở chính giữa */
    .cake-stage {
      position: relative;
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 2px auto 14px;
      z-index: 6;
    }

    /* Quầng sáng ấm áp quanh nến */
    .candle-ambient-glow {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 170px;
      height: 110px;
      background: radial-gradient(circle, rgba(255, 223, 128, 0.55) 0%, rgba(255, 182, 193, 0.25) 50%, rgba(255, 255, 255, 0) 75%);
      border-radius: 50%;
      pointer-events: none;
      animation: glowPulse 2s ease-in-out infinite alternate;
      transition: opacity 0.6s ease;
    }

    .candle-ambient-glow.off {
      opacity: 0;
    }

    @keyframes glowPulse {
      0% { transform: translateX(-50%) scale(0.94); opacity: 0.8; }
      100% { transform: translateX(-50%) scale(1.08); opacity: 1; }
    }

    .cake-svg {
      width: 100%;
      max-width: 350px;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 14px 24px rgba(214, 90, 132, 0.2));
    }

    /* Animation ngọn lửa nến lung linh */
    .candle-flame-group {
      transform-origin: center bottom;
      animation: flameFlicker 1.2s ease-in-out infinite alternate;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .candle-flame-group.flame-2 {
      animation-delay: -0.5s;
    }

    .candle-flame-group.blown-out {
      opacity: 0;
      transform: scale(0.1) translateY(6px);
      animation: none;
    }

    @keyframes flameFlicker {
      0% { transform: scale(1, 1) rotate(-2deg); }
      35% { transform: scale(0.95, 1.06) rotate(2deg); }
      70% { transform: scale(1.04, 0.96) rotate(-1.5deg); }
      100% { transform: scale(0.98, 1.05) rotate(2.5deg); }
    }

    /* Làn khói mỏng bay lên khi tắt nến */
    .smoke-group {
      opacity: 0;
      pointer-events: none;
    }

    .smoke-group.active .smoke-path {
      animation: smokeRise 2.4s ease-out forwards;
    }

    .smoke-group.active .smoke-path.s2 {
      animation-delay: 0.22s;
    }

    @keyframes smokeRise {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.6);
      }
      25% {
        opacity: 0.75;
      }
      100% {
        opacity: 0;
        transform: translateY(-42px) translateX(8px) scale(1.35);
      }
    }

    /* Khay nút tương tác ở Màn 3 */
    .controls-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 440px;
      width: 100%;
      z-index: 7;
      padding: 4px 8px;
    }

    .controls-grid .btn-pastel {
      font-size: 0.95rem;
      padding: 11px 22px;
    }

    /* Hộp quà ở góc màn hình */
    .corner-gift-box {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 78px;
      height: 86px;
      cursor: pointer;
      z-index: 15;
      filter: drop-shadow(0 8px 16px rgba(214, 90, 132, 0.28));
      transition: transform 0.3s ease;
    }

    .corner-gift-box:hover {
      transform: scale(1.06);
    }

    .corner-gift-box.bounce {
      animation: giftBounce 2.8s ease-in-out infinite;
    }

    @keyframes giftBounce {
      0%, 80%, 100% { transform: translateY(0) rotate(0deg); }
      85% { transform: translateY(-7px) rotate(-4deg); }
      90% { transform: translateY(-7px) rotate(4deg); }
      95% { transform: translateY(-3px) rotate(-2deg); }
    }

    #gift-lid-group {
      transform-origin: 15px 38px;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .corner-gift-box.opened #gift-lid-group {
      transform: translateY(-20px) rotate(-28deg);
    }

    .gift-sparkles {
      opacity: 0;
      transform: translateY(10px) scale(0.5);
      transform-origin: center;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .corner-gift-box.opened .gift-sparkles {
      opacity: 1;
      transform: translateY(-10px) scale(1.1);
    }

    /* ==========================================================================
       7. MODAL POPUP (THẺ LỜI NHẮN BẤT NGỜ & ĐỌC LẠI THƯ)
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(109, 67, 82, 0.32);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: 88dvh;
      overflow-y: auto;
      background: linear-gradient(180deg, #fffdfd 0%, #fff0f5 100%);
      border: 2.5px solid #f7c6d8;
      border-radius: 26px;
      padding: 30px 24px 24px;
      box-shadow: 0 20px 45px rgba(180, 70, 110, 0.25);
      transform: scale(0.88) translateY(16px);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
    }

    .modal-overlay.open .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid #f5bfd2;
      background: #fff5f8;
      color: var(--rose-deep);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .modal-close-btn:hover {
      background: #ffe0eb;
      transform: rotate(90deg);
    }

    .gift-modal-icon {
      font-size: 2.8rem;
      margin-bottom: 8px;
      display: inline-block;
      animation: gentlePulse 2s infinite ease-in-out;
    }

    .gift-modal-title {
      font-family: var(--font-hand);
      font-size: 2rem;
      color: var(--rose-deep);
      margin-bottom: 12px;
    }

    .gift-modal-text {
      font-size: 1.08rem;
      line-height: 1.65;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.75);
      padding: 16px 18px;
      border-radius: 18px;
      border: 1.5px dashed #f5c2d4;
      margin-bottom: 20px;
    }

    /* Chỉnh lại nội dung thư khi xem trong popup */
    .reread-letter-body {
      text-align: left;
      font-family: var(--font-hand);
      font-size: clamp(1.28rem, 3.8vw, 1.5rem);
      line-height: 1.65;
      color: #6b3c4e;
      padding: 10px 6px;
    }

    .reread-letter-body p {
      margin-bottom: 12px;
      text-indent: 16px;
    }

    .reread-letter-body .reread-greeting {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--rose-deep);
      text-indent: 0;
    }

    .reread-letter-body .reread-sign {
      text-align: right;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--rose-deep);
      margin-top: 14px;
    }

    /* Responsive tối ưu cho màn hình điện thoại nhỏ */
    @media (max-width: 480px) {
      .letter-card {
        padding: 26px 20px 22px;
      }
      .controls-grid {
        gap: 8px;
      }
      .controls-grid .btn-pastel {
        font-size: 0.88rem;
        padding: 10px 16px;
      }
      .corner-gift-box {
        width: 64px;
        height: 72px;
        right: 10px;
        bottom: 10px;
      }
      .balloon {
        opacity: 0.6;
      }
    }
  </style>

        <g id="smoke-1" class="smoke-group">
          <path class="smoke-path s1" d="M152 44 Q144 32 155 22 Q164 12 150 2" stroke="#b89ca6" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- ==========================================================================
       POPUP 1: THẺ LỜI NHẮN BẤT NGỜ (MỞ QUÀ)
       ========================================================================== -->
  <div id="modal-gift" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="modal-close-btn" data-close="modal-gift" aria-label="Đóng">✕</button>

  <!-- ==========================================================================
       POPUP 2: ĐỌC LẠI THƯ
       ========================================================================== -->
  <div id="modal-letter" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="modal-close-btn" data-close="modal-letter" aria-label="Đóng">✕</button>
      <div id="reread-letter-container" class="reread-letter-body"></div>
      <div style="margin-top: 14px;">
        <button class="btn-pastel" data-close="modal-letter">Đóng thư 💌</button>

  </div>

  <!-- ==========================================================================
       PHẦN JAVASCRIPT XỬ LÝ NỘI DUNG & HIỆU ỨNG
       ========================================================================== -->
  <script>
    /* ==========================================================================
       👉 SỬA Ở ĐÂY: CẤU HÌNH TÊN, NỘI DUNG THƯ & LỜI NHẮN BẤT NGỜ
       ========================================================================== */
    const CONFIG = {
      // Tên chị gái và tên em
      tenChi: "Đoàn Nguyễn Quế Trân",
      tenEm: "Đoàn Minh Triết",

      // Mở đầu và kết thư
      moDauThu: "Gửi chị Đoàn Nguyễn Quế Trân,",
      ketThu: "Em của chị, Đoàn Minh Triết 💗",

      // 3 đoạn thân thư ([LỜI CHÚC 1], [LỜI CHÚC 2], [LỜI CHÚC 3]) chúc chị tròn 20 tuổi
      thanThu: [
        "Chúc mừng sinh nhật tuổi 20 thật rực rỡ của chị hai! Vậy là chị hai đã chính thức bước sang ngưỡng cửa tuổi đôi mươi – độ tuổi đẹp nhất, nhiều ước mơ và tràn đầy năng lượng nhất rồi đó nha. 🌸",
        "Tuổi mới, em chúc chị hai lúc nào cũng xinh đẹp, rạng rỡ, học tập và làm việc gì cũng thuận buồm xuôi gió. Mong chị hai luôn giữ được nụ cười tươi tắn, bớt thức khuya lại và luôn được mọi người xung quanh yêu thương thật nhiều!",
        "Cảm ơn chị vì đã luôn là người chị tuyệt vời, hay quan tâm và chiều chuộng đứa em này. Dù chị hai có lớn thêm bao nhiêu tuổi thì nhớ là vẫn phải bao em đi ăn uống dài dài đó nhé! Chúc chị hai tuổi 20 ngập tràn niềm vui và hạnh phúc! 🎂✨"
      ],

      // [LỜI NHẮN BẤT NGỜ] khi bấm nút "🎁 Mở quà"
      loiNhanBatNgo: "🎉 Tèn ten! Bất ngờ chưa chị 2 ơi! Phần quà đặc biệt hôm nay là một phiếu 'Đi ăn trà sữa & đồ ngon tự chọn' do chính đứa em này chi trả! Chúc tuổi 20 của chị mỗi ngày đều ngọt ngào như chiếc bánh kem hồng này nhé! 🧋🍓💝"
    };
    /* ======================= KẾT THÚC PHẦN SỬA Ở ĐÂY ======================= */


    // ==========================================================================
    // 1. KHỞI TẠO NỘI DUNG TỪ BIẾN CONFIG VÀO GIAO DIỆN
    // ==========================================================================
    const headingScreen3 = document.getElementById("main-birthday-heading");
    const surpriseTextEl = document.getElementById("surprise-message-text");
    const rereadContainer = document.getElementById("reread-letter-container");

    headingScreen3.textContent = `Chúc mừng sinh nhật chị ${CONFIG.tenChi}! 🎂`;
    surpriseTextEl.textContent = CONFIG.loiNhanBatNgo;

    function renderRereadModal() {
      let html = `<p class="reread-greeting">${CONFIG.moDauThu}</p>`;
      CONFIG.thanThu.forEach(doan => {
        html += `<p>${doan}</p>`;
      });
      html += `<div class="reread-sign">${CONFIG.ketThu}</div>`;
      rereadContainer.innerHTML = html;
    }
    renderRereadModal();


    // ==========================================================================
    // 2. TẠO TRÁI TIM & CÁNH HOA BAY LƠ LỬNG Ở NỀN (NHẸ MÁY ĐIỆN THOẠI)
    // ==========================================================================
    function createFloatingBackground() {
      const container = document.getElementById("floating-bg");
      const symbols = ["💗", "🌸", "💕", "🌷", "✨", "🩷"];
      const count = 14;

      for (let i = 0; i < count; i++) {
        const el = document.createElement("div");
        el.className = "float-item";
        el.textContent = symbols[i % symbols.length];
        el.style.left = `${Math.random() * 94 + 2}%`;
        el.style.fontSize = `${Math.random() * 10 + 14}px`;
        el.style.animationDuration = `${Math.random() * 9 + 11}s`;
        el.style.animationDelay = `-${Math.random() * 15}s`;
        container.appendChild(el);
      }
    }
    createFloatingBackground();


    // ==========================================================================
    // 3. CHUYỂN MÀN HÌNH & HIỆU ỨNG MÀN 1 -> MÀN 2 -> MÀN 3
    // ==========================================================================
    const screen1 = document.getElementById("screen-1");
    const screen2 = document.getElementById("screen-2");
    const screen3 = document.getElementById("screen-3");

    function switchScreen(fromEl, toEl, callback) {
      fromEl.classList.remove("visible");
      setTimeout(() => {
        fromEl.classList.remove("active");
        toEl.classList.add("active");
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            toEl.classList.add("visible");
            window.scrollTo({ top: 0, behavior: "smooth" });
            if (callback) callback();
          });
        });
      }, 600);
    }

    // Màn 1: Mở phong bì thư
    const envelopeTrigger = document.getElementById("envelope-trigger");
    const btnOpenLetter = document.getElementById("btn-open-letter");
    let isOpeningEnvelope = false;

    function handleOpenEnvelope() {
      if (isOpeningEnvelope) return;
      isOpeningEnvelope = true;

      envelopeTrigger.classList.remove("wobble");
      envelopeTrigger.classList.add("open");
      btnOpenLetter.style.pointerEvents = "none";
      btnOpenLetter.textContent = "Đang mở thư... 💌";

      setTimeout(() => {
        switchScreen(screen1, screen2, startLetterTyping);
      }, 1150);
    }

    envelopeTrigger.addEventListener("click", handleOpenEnvelope);
    btnOpenLetter.addEventListener("click", handleOpenEnvelope);


    // ==========================================================================
    // 4. MÀN 2: HIỆU ỨNG GÕ CHỮ & HIỆN DẦN TỪNG DÒNG THƯ
    // ==========================================================================
    let letterTyped = false;

    function typeText(element, text, speed = 24) {
      return new Promise(resolve => {
        element.classList.add("reveal-line", "typing-cursor");
        let idx = 0;
        const timer = setInterval(() => {
          idx++;
          element.textContent = text.slice(0, idx);
          if (idx >= text.length) {
            clearInterval(timer);
            element.classList.remove("typing-cursor");
            resolve();
          }
        }, speed);
      });
    }

    async function startLetterTyping() {
      if (letterTyped) return;
      letterTyped = true;

      const greetingEl = document.getElementById("letter-greeting");
      const bodyEl = document.getElementById("letter-body");
      const signEl = document.getElementById("letter-sign");
      const nextBtn = document.getElementById("btn-next-screen3");

      bodyEl.innerHTML = "";
      const paragraphEls = CONFIG.thanThu.map(() => {
        const p = document.createElement("p");
        p.className = "letter-paragraph";
        bodyEl.appendChild(p);
        return p;
      });

      await typeText(greetingEl, CONFIG.moDauThu, 32);
      await new Promise(r => setTimeout(r, 260));

      for (let i = 0; i < CONFIG.thanThu.length; i++) {
        await typeText(paragraphEls[i], CONFIG.thanThu[i], 20);
        await new Promise(r => setTimeout(r, 280));
      }

      await typeText(signEl, CONFIG.ketThu, 32);
      nextBtn.classList.add("show");
    }

    // Bấm nút "Tiếp theo ➜" để sang Màn 3, bật pháo giấy rơi nền + tự động bắn mỗi 2-3 giây
    document.getElementById("btn-next-screen3").addEventListener("click", () => {
      fireSoftTransitionConfetti();
      switchScreen(screen2, screen3, () => {
        startAmbientConfetti();
        startAutoConfetti();
      });
    });


    // ==========================================================================
    // 5. HỆ THỐNG PHÁO GIẤY (PASTEL CONFETTI RƠI LIÊN TỤC & TỰ ĐỘNG BẮN 2-3 GIÂY)
    // ==========================================================================
    const pastelColors = ["#ffacc5", "#ffd1dc", "#fff1cc", "#f794b5", "#ffc8dd", "#ffdfd3"];
    const ambientCanvas = document.getElementById("ambient-canvas");
    const ctx = ambientCanvas.getContext("2d");
    let ambientParticles = [];
    let burstParticles = [];
    let ambientRunning = false;

    function resizeCanvas() {
      ambientCanvas.width = window.innerWidth;
      ambientCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function startAmbientConfetti() {
      if (ambientRunning) return;
      ambientRunning = true;

      for (let i = 0; i < 32; i++) {
        ambientParticles.push({
          x: Math.random() * ambientCanvas.width,
          y: Math.random() * ambientCanvas.height - ambientCanvas.height,
          w: Math.random() * 6 + 5,
          h: Math.random() * 4 + 4,
          color: pastelColors[i % pastelColors.length],
          vy: Math.random() * 0.9 + 0.55,
          vx: (Math.random() - 0.5) * 0.6,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.04
        });
      }
      requestAnimationFrame(updateCanvasParticles);
    }

    function updateCanvasParticles() {
      ctx.clearRect(0, 0, ambientCanvas.width, ambientCanvas.height);

      for (let p of ambientParticles) {
        p.y += p.vy;
        p.x += p.vx + Math.sin(p.angle) * 0.35;
        p.angle += p.spin;

        if (p.y > ambientCanvas.height + 15) {
          p.y = -15;
          p.x = Math.random() * ambientCanvas.width;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.78;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }

      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const b = burstParticles[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += 0.18;
        b.alpha -= 0.012;
        b.angle += b.spin;

        if (b.alpha <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.angle);
        ctx.fillStyle = b.color;
        ctx.globalAlpha = Math.max(0, b.alpha);
        ctx.fillRect(-b.size / 2, -b.size / 2, b.size, b.size * 0.7);
        ctx.restore();
      }

      if (ambientRunning || burstParticles.length > 0) {
        requestAnimationFrame(updateCanvasParticles);
      }
    }

    function fallbackCanvasBurst(originXRatio, originYRatio, count = 35) {
      const startX = ambientCanvas.width * originXRatio;
      const startY = ambientCanvas.height * originYRatio;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 3;
        burstParticles.push({
          x: startX,
          y: startY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          size: Math.random() * 6 + 5,
          color: pastelColors[i % pastelColors.length],
          alpha: 1,
          angle: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.15
        });
      }
      if (!ambientRunning) requestAnimationFrame(updateCanvasParticles);
    }

    function fireSoftTransitionConfetti() {
      if (typeof confetti === "function") {
        confetti({
          particleCount: 45,
          spread: 70,
          origin: { y: 0.6 },
          colors: pastelColors,
          disableForReducedMotion: true
        });
      } else {
        fallbackCanvasBurst(0.5, 0.6, 45);
      }
    }

    function fireCornerConfetti() {
      if (typeof confetti === "function") {
        confetti({
          particleCount: 45,
          angle: 60,
          spread: 55,
          origin: { x: 0.05, y: 0.75 },
          colors: pastelColors
        });
        confetti({
          particleCount: 45,
          angle: 120,
          spread: 55,
          origin: { x: 0.95, y: 0.75 },
          colors: pastelColors
        });
      } else {
        fallbackCanvasBurst(0.1, 0.75, 35);
        fallbackCanvasBurst(0.9, 0.75, 35);
      }
    }

    // Hiệu ứng bắn pháo giấy kết hợp pháo hoa nhỏ màu pastel
    function fireBigCelebrationConfetti() {
      const randomX = Math.random() * 0.5 + 0.25; // Ngẫu nhiên vị trí ngang từ 0.25 -> 0.75
      const randomY = Math.random() * 0.25 + 0.35; // Ngẫu nhiên vị trí dọc từ 0.35 -> 0.6

      if (typeof confetti === "function") {
        confetti({
          particleCount: 38,
          spread: 75,
          origin: { x: randomX, y: randomY },
          colors: pastelColors
        });
        setTimeout(() => {
          confetti({
            particleCount: 24,
            spread: 360,
            startVelocity: 22,
            ticks: 55,
            origin: { x: 1 - randomX, y: randomY - 0.08 },
            colors: pastelColors
          });
        }, 200);
      } else {
        fallbackCanvasBurst(randomX, randomY, 35);
      }
    }

    // Tự động bắn pháo giấy mỗi 2 - 3 giây ở Màn 3
    let autoConfettiTimeout = null;
    function startAutoConfetti() {
      if (autoConfettiTimeout) return;

      function loopConfetti() {
        // Chỉ bắn khi đang mở trang trên màn hình để mượt máy
        if (!document.hidden) {
          fireBigCelebrationConfetti();
        }
        // Thời gian ngẫu nhiên từ 2.2 giây đến 3.0 giây (2200ms - 3000ms)
        const nextDelay = Math.floor(Math.random() * 800) + 2200;
        autoConfettiTimeout = setTimeout(loopConfetti, nextDelay);
      }

      // Đợt bắn tự động đầu tiên sau 2 giây khi vào Màn 3
      autoConfettiTimeout = setTimeout(loopConfetti, 2000);
    }


    // ==========================================================================
    // 6. XỬ LÝ CÁC NÚT TƯƠNG TÁC Ở MÀN 3
    // ==========================================================================

    // --- Nút 1: 🕯️ Thổi nến / Thắp lại nến ---
    const btnCandle = document.getElementById("btn-candle");
    const flame1 = document.getElementById("flame-1");
    const flame2 = document.getElementById("flame-2");
    const smoke1 = document.getElementById("smoke-1");
    const smoke2 = document.getElementById("smoke-2");
    const candleGlow = document.getElementById("candle-glow");
    const wishBadge = document.getElementById("wish-badge");
    let candlesLit = true;

    btnCandle.addEventListener("click", () => {
      if (candlesLit) {
        candlesLit = false;
        flame1.classList.add("blown-out");
        flame2.classList.add("blown-out");
        candleGlow.classList.add("off");

        smoke1.classList.remove("active");
        smoke2.classList.remove("active");
        void smoke1.offsetWidth;
        smoke1.classList.add("active");
        smoke2.classList.add("active");

        setTimeout(() => {
          fireCornerConfetti();
          wishBadge.classList.add("show");
        }, 350);

        btnCandle.innerHTML = "🕯️ Thắp lại nến";
      } else {
        candlesLit = true;
        flame1.classList.remove("blown-out");
        flame2.classList.remove("blown-out");
        candleGlow.classList.remove("off");
        smoke1.classList.remove("active");
        smoke2.classList.remove("active");
        wishBadge.classList.remove("show");

        btnCandle.innerHTML = "🕯️ Thổi nến";
      }
    });

    // --- Nút 2: 🎁 Mở quà & Hộp quà ở góc màn hình ---
    const btnGift = document.getElementById("btn-gift");
    const cornerGift = document.getElementById("corner-gift");
    const modalGift = document.getElementById("modal-gift");

    function openGiftBox() {
      cornerGift.classList.remove("bounce");
      cornerGift.classList.add("opened");
      fireSoftTransitionConfetti();

      setTimeout(() => {
        modalGift.classList.add("open");
      }, 420);
    }

    btnGift.addEventListener("click", openGiftBox);
    cornerGift.addEventListener("click", openGiftBox);

    // --- Nút 3: 💌 Đọc lại thư ---
    const modalLetter = document.getElementById("modal-letter");
    document.getElementById("btn-reread").addEventListener("click", () => {
      modalLetter.classList.add("open");
    });

    // Đóng các popup khi bấm nút đóng hoặc bấm ra vùng nền mờ
    document.querySelectorAll("[data-close]").forEach(btn => {
      btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-close");
        document.getElementById(targetId).classList.remove("open");
        if (targetId === "modal-gift") {
          cornerGift.classList.remove("opened");
          cornerGift.classList.add("bounce");
        }
      });
    });

    document.querySelectorAll(".modal-overlay").forEach(overlay => {
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) {
          overlay.classList.remove("open");
          if (overlay.id === "modal-gift") {
            cornerGift.classList.remove("opened");
            cornerGift.classList.add("bounce");
          }
        }
      });
    });

    // --- Nút 4: 🎵 Bật / Tắt nhạc nền ---
    const btnMusic = document.getElementById("btn-music");
    const bgMusic = document.getElementById("bg-music");
    let isPlayingMusic = false;
    let synthInterval = null;
    let audioCtx = null;

    const melodyNotes = [
      [261.63, 0.35], [261.63, 0.35], [293.66, 0.65], [261.63, 0.65], [349.23, 0.65], [329.63, 1.1],
      [261.63, 0.35], [261.63, 0.35], [293.66, 0.65], [261.63, 0.65], [392.00, 0.65], [349.23, 1.1],
      [261.63, 0.35], [261.63, 0.35], [523.25, 0.65], [440.00, 0.65], [349.23, 0.65], [329.63, 0.65], [293.66, 1.1],
      [466.16, 0.35], [466.16, 0.35], [440.00, 0.65], [349.23, 0.65], [392.00, 0.65], [349.23, 1.2]
    ];

    function playFallbackMusicBox() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();

      let noteIndex = 0;
      function scheduleNextNote() {
        if (!isPlayingMusic) return;
        const [freq, duration] = melodyNotes[noteIndex];
        noteIndex = (noteIndex + 1) % melodyNotes.length;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);

        synthInterval = setTimeout(scheduleNextNote, duration * 1000);
      }
      scheduleNextNote();
    }

    function stopFallbackMusicBox() {
      if (synthInterval) {
        clearTimeout(synthInterval);
        synthInterval = null;
      }
    }

    btnMusic.addEventListener("click", () => {
      if (!isPlayingMusic) {
        isPlayingMusic = true;
        btnMusic.textContent = "🎵 Nhạc: Bật";
        bgMusic.play().catch(() => {
          playFallbackMusicBox();
        });
      } else {
        isPlayingMusic = false;
        btnMusic.textContent = "🎵 Nhạc: Tắt";
        bgMusic.pause();
        stopFallbackMusicBox();
      }
    });
  </script>
</body>
</html>
